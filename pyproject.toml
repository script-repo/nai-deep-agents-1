[project]
name = "nai-deep-agents"
version = "0.1.0"
description = "Ten production-minded LangChain Deep Agents for AI governance, cost and safety, with a streaming web UI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "script-repo" }]
dependencies = [
  "deepagents==0.7.28",
  "langchain==1.4.6",
  "langchain-core==1.6.12",
  "langgraph==1.2.16",
  "langchain-openai==1.7.2",
  "langchain-anthropic==1.7.6",
  "langchain-ollama==1.1.0",
  "langgraph-checkpoint-sqlite==3.1.2",
  "fastapi==0.151.0",
  "uvicorn[standard]==0.54.0",
  "sse-starlette==3.5.0",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres==3.2.0", "psycopg[binary,pool]>=3.2,<4"]

[project.scripts]
nai-agents = "nai_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1.0,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nai_agents"]
artifacts = ["src/nai_agents/server/static/**"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
