name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: UI is served by the Python app
        working-directory: .
        run: |
          test -f src/nai_agents/server/static/index.html
          pip install uv && uv sync --frozen
          uv run python -c "
          from fastapi.testclient import TestClient
          from nai_agents.server.app import create_app
          with TestClient(create_app()) as c:
              r = c.get('/'); assert r.status_code == 200 and '<div id=' in r.text, r.text[:200]
              assert c.get('/api/agents').status_code == 200
          print('UI served OK')"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/nai-deep-agents
      - run: helm template ci deploy/helm/nai-deep-agents > /dev/null
      - run: kubectl kustomize deploy/k8s > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nai-deep-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (mock mode)
        run: |
          docker run -d --name nda -p 8000:8000 nai-deep-agents:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/agents | python3 -c "import json,sys; a=json.load(sys.stdin); assert len(a)==10, a; print(len(a),'agents')"
          curl -fs localhost:8000/ | grep -q '<div id='
          docker logs nda
