name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v7
        with: {python-version: "3.13"}
      - name: Build UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package UI and wheel
        run: |
          tar -czf nai-agents-ui.tar.gz -C src/nai_agents/server/static .
          uv build --wheel
          ls -la dist
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "${GITHUB_REF_NAME}" nai-agents-ui.tar.gz dist/*.whl \
            --title "${GITHUB_REF_NAME}" --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" nai-agents-ui.tar.gz dist/*.whl --clobber

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nai-deep-agents
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
