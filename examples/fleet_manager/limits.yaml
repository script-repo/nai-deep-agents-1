# Usage limits and prices for each coding agent the fleet manager can dispatch to.
#
# daily_tasks / daily_tokens: hard caps per UTC day; a dispatch that would exceed one is refused.
# max_tokens_per_task: refuse tasks estimated larger than this (split them instead).
# input_per_mtok / output_per_mtok: USD per million tokens, used for the cost ledger.
# Prices are illustrative; set them to your contract or amortized on-prem cost.
timezone: UTC
default_timeout_s: 900
agents:
  builtin-coder:
    description: The fleet manager's own deep-agent coder (writes files in the agent's virtual filesystem).
    kind: builtin
    daily_tasks: 40
    daily_tokens: 400000
    max_tokens_per_task: 60000
    input_per_mtok: 0.80
    output_per_mtok: 3.20
  claude:
    description: Claude Code CLI, run as `claude -p "<task>"`.
    kind: external
    daily_tasks: 25
    daily_tokens: 2000000
    max_tokens_per_task: 200000
    input_per_mtok: 3.00
    output_per_mtok: 15.00
  codex:
    description: OpenAI Codex CLI, run as `codex exec "<task>"`.
    kind: external
    daily_tasks: 25
    daily_tokens: 1500000
    max_tokens_per_task: 200000
    input_per_mtok: 1.25
    output_per_mtok: 10.00
  cursor-agent:
    description: Cursor CLI agent, run as `cursor-agent -p "<task>"`.
    kind: external
    daily_tasks: 10
    daily_tokens: 500000
    max_tokens_per_task: 100000
    input_per_mtok: 1.25
    output_per_mtok: 10.00
