# NOT applied by kustomize. Create the real Secret out of band, e.g.:
#   kubectl -n nai-agents create secret generic nai-agents-secrets \
#     --from-literal=LLM_API_KEY='<nai endpoint api key>' \
#     --from-literal=APP_AUTH_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=APP_BASIC_AUTH='alice:change-me'
#   (optional) --from-literal=APP_DATABASE_URL='postgresql://nai:pw@postgres:5432/nai_agents'
apiVersion: v1
kind: Secret
metadata:
  name: nai-agents-secrets
  namespace: nai-agents
type: Opaque
stringData:
  LLM_API_KEY: "replace-me"
  APP_AUTH_TOKEN: "replace-me"
